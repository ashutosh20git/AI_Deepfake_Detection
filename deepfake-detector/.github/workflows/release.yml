name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        
      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
            
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Build and push Node Express Image
        uses: docker/build-push-action@v5
        with:
          context: ./node-app
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/deepfake-detector-node:latest
            ghcr.io/${{ github.repository_owner }}/deepfake-detector-node:${{ github.ref_name }}
            
      - name: Build and push Python ML Image
        uses: docker/build-push-action@v5
        with:
          context: ./python-service
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/deepfake-detector-ml:latest
            ghcr.io/${{ github.repository_owner }}/deepfake-detector-ml:${{ github.ref_name }}
