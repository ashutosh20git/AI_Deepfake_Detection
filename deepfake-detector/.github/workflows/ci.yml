name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main

jobs:
  node-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        working-directory: ./node-app
        run: npm ci
      - name: Run lint
        working-directory: ./node-app
        run: npm run lint

  python-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install ruff
        run: pip install ruff
      - name: Run ruff check
        run: ruff check python-service/

  docker-build:
    needs: [node-lint, python-lint]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build node-app image
        uses: docker/build-push-action@v5
        with:
          context: ./node-app
          push: false
          tags: node-app:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build python-service image
        uses: docker/build-push-action@v5
        with:
          context: ./python-service
          push: false
          tags: python-service:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
