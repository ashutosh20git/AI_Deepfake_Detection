<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DEEPFAKE.DETECT — Request Access</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <script src="/config.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { theme: { extend: { fontFamily: { mono: ["JetBrains Mono", "monospace"], sans: ["Inter", "system-ui", "sans-serif"] } } } };</script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="/css/custom.css">
</head>
<body class="bg-zinc-950 text-zinc-50 font-sans antialiased min-h-screen flex items-center justify-center relative">
  <div class="fixed inset-0 -z-20 noise-overlay"></div>
  <div class="absolute -right-20 -top-20 h-[600px] w-[600px] rounded-full bg-cyan-500/5 blur-3xl -z-10"></div>
  <main class="w-full max-w-[440px] px-6 opacity-0 translate-y-1 transition-all duration-200">
    <section class="border border-zinc-800 bg-zinc-900 rounded-lg p-8 shadow-2xl shadow-black/50 space-y-6">
      <div class="space-y-2">
        <p class="text-xs font-mono uppercase tracking-widest text-zinc-500">SYSTEM ONBOARDING</p>
        <h1 class="text-2xl font-mono font-semibold tracking-tight">Request Access</h1>
        <p class="text-sm text-zinc-400">Create your analyst profile to enter the platform.</p>
      </div>
      <form id="register-form" class="space-y-4">
        <input id="email" type="email" required placeholder="Email" class="w-full bg-zinc-950 border border-zinc-800 rounded-md px-4 py-2.5 text-zinc-50 placeholder-zinc-600 font-mono text-sm focus:outline-none focus:border-cyan-500 focus:ring-2 focus:ring-cyan-500/20">
        <input id="password" type="password" required placeholder="Password" class="w-full bg-zinc-950 border border-zinc-800 rounded-md px-4 py-2.5 text-zinc-50 placeholder-zinc-600 font-mono text-sm focus:outline-none focus:border-cyan-500 focus:ring-2 focus:ring-cyan-500/20">
        <div class="border border-zinc-800 bg-zinc-950 rounded-md p-3 min-h-[78px] flex items-center justify-center"><span class="text-xs font-mono text-zinc-500">hCaptcha placeholder</span></div>
        <button id="submit-btn" type="submit" class="w-full bg-cyan-500 hover:bg-cyan-400 text-zinc-950 font-mono font-semibold px-5 py-2.5 rounded-md shadow-lg shadow-cyan-500/20 text-sm transition-all focus:outline-none focus:ring-2 focus:ring-cyan-500/20 disabled:opacity-50 disabled:cursor-not-allowed">CREATE ACCOUNT →</button>
      </form>
      <p class="text-sm text-zinc-500">Already have access? <a href="/login.html" class="hover:text-cyan-500">Return to login</a></p>
    </section>
  </main>
  <script type="module">
    import { registerWithEmail } from "/js/auth.js";
    import { showToast } from "/js/components.js";
    document.addEventListener("DOMContentLoaded", () => {
      document.querySelector("main").classList.remove("opacity-0", "translate-y-1");
      if (window.lucide?.createIcons) window.lucide.createIcons();
    });
    document.getElementById("register-form").addEventListener("submit", async (event) => {
      event.preventDefault();
      const button = document.getElementById("submit-btn");
      button.disabled = true;
      button.textContent = "PROCESSING...";
      try {
        await registerWithEmail(document.getElementById("email").value, document.getElementById("password").value);
        showToast("Access request accepted.", "success");
        setTimeout(() => (window.location.href = "/onboarding.html"), 400);
      } catch (error) {
        showToast(error.message, "error");
      } finally {
        button.disabled = false;
        button.textContent = "CREATE ACCOUNT →";
      }
    });
  </script>
</body>
</html>
