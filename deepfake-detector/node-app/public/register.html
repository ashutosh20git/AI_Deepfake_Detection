<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DEEPFAKE.DETECT — Request Access</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            mono: ['JetBrains Mono', 'monospace'],
            sans: ['Inter', 'system-ui', 'sans-serif']
          }
        }
      }
    }
  </script>

  <link rel="stylesheet" href="/css/custom.css">
</head>
<body class="bg-zinc-950 text-zinc-50 font-sans antialiased min-h-screen flex flex-col items-center justify-center relative overflow-hidden">
  <div class="bg-radial-blob"></div>

  <div id="toast-container" class="fixed bottom-6 right-6 z-50 flex flex-col gap-3"></div>

  <main class="w-full max-w-[440px] px-6 relative z-10 page-mount">
    <div class="flex flex-col items-center mb-8">
      <svg class="h-10 w-10 text-cyan-500 mb-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
      </svg>
      <div class="font-mono font-bold tracking-wider text-sm text-zinc-50">DEEPFAKE.DETECT</div>
    </div>

    <div class="bg-zinc-900 border border-zinc-800 rounded-lg p-8 shadow-2xl shadow-black/50 w-full mb-4 relative overflow-hidden">
      <div class="text-xs font-mono uppercase tracking-widest text-zinc-500 mb-4">SYSTEM ONBOARDING</div>
      <h1 class="text-2xl font-mono font-semibold tracking-tight text-white mb-2">Request Access</h1>
      <p class="text-zinc-400 text-sm mb-6">Create your forensic analyst profile.</p>
      
      <form id="register-form" class="space-y-4">
        <div>
          <input type="email" id="email" required placeholder="Email address" class="w-full bg-zinc-950 border border-zinc-800 rounded-md px-4 py-2.5 text-zinc-50 placeholder-zinc-600 font-mono text-sm focus:outline-none focus:border-cyan-500 focus:ring-2 focus:ring-cyan-500/20 transition-all"/>
        </div>
        <div>
          <input type="password" id="password" required placeholder="Strong Password" class="w-full bg-zinc-950 border border-zinc-800 rounded-md px-4 py-2.5 text-zinc-50 placeholder-zinc-600 font-mono text-sm focus:outline-none focus:border-cyan-500 focus:ring-2 focus:ring-cyan-500/20 transition-all"/>
        </div>
        
        <div class="bg-zinc-950 border border-zinc-800 rounded-md p-3 flex items-center justify-between">
            <div class="flex items-center gap-3">
               <input type="checkbox" id="mock-captcha" class="w-5 h-5 accent-cyan-500 bg-zinc-900 border-zinc-700 rounded cursor-pointer" required/>
               <span class="text-zinc-400 text-sm">I am human</span>
            </div>
            <svg class="h-6 w-6 text-zinc-600" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>
        </div>

        <button type="submit" id="submit-btn" class="w-full bg-zinc-200 hover:bg-white text-zinc-950 font-mono font-semibold px-5 py-2.5 rounded-md shadow-lg shadow-white/10 transition-all mt-2 flex items-center justify-center">
          CREATE ACCOUNT &rarr;
        </button>
      </form>
      
      <div class="mt-6 text-center">
        <a href="/login.html" class="text-sm text-zinc-500 hover:text-cyan-500 font-sans transition-colors">Already have access? Return to login</a>
      </div>
    </div>
    
  </main>

  <script type="module">
    import { registerWithEmail } from './js/auth.js';
    import { showToast } from './js/components.js';

    document.getElementById('register-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submit-btn');
      const email = document.getElementById('email').value;
      const pwd = document.getElementById('password').value;
      
      btn.innerHTML = 'PROCESSING...';
      btn.disabled = true;

      try {
        await registerWithEmail(email, pwd);
        window.location.href = '/onboarding.html';
      } catch (err) {
        showToast(err.message, 'error');
        btn.innerHTML = 'CREATE ACCOUNT &rarr;';
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
