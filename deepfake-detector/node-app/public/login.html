<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DEEPFAKE.DETECT — Authentication</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <script src="/config.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: { fontFamily: { mono: ["JetBrains Mono", "monospace"], sans: ["Inter", "system-ui", "sans-serif"] } } }
    };
  </script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="/css/custom.css">
</head>
<body class="bg-zinc-950 text-zinc-50 font-sans antialiased min-h-screen flex items-center justify-center relative">
  <div class="fixed inset-0 -z-20 noise-overlay"></div>
  <div class="absolute -right-20 -top-20 h-[600px] w-[600px] rounded-full bg-cyan-500/5 blur-3xl -z-10"></div>
  <main class="w-full max-w-[440px] px-6 opacity-0 translate-y-1 transition-all duration-200">
    <div class="space-y-6">
      <div class="text-center space-y-3">
        <svg class="h-10 w-10 text-cyan-500 mx-auto" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3 20 7v6c0 5-3.5 7.8-8 9-4.5-1.2-8-4-8-9V7l8-4Z"/></svg>
        <p class="font-mono font-bold tracking-wider text-sm">DEEPFAKE.DETECT</p>
      </div>
      <section class="border border-zinc-800 bg-zinc-900 rounded-lg p-8 shadow-2xl shadow-black/50 space-y-6">
        <div>
          <p class="text-xs font-mono uppercase tracking-widest text-zinc-500">SECURE ACCESS</p>
          <h1 class="text-2xl font-mono font-semibold tracking-tight mt-2">Authentication</h1>
          <p class="text-zinc-400 text-sm mt-2">Verify your identity to continue</p>
        </div>
        <div id="mode-tabs" class="hidden gap-3">
          <button id="online-tab" class="px-4 py-2 rounded-full text-xs font-mono border border-zinc-800 text-zinc-400">ONLINE</button>
          <button id="offline-tab" class="px-4 py-2 rounded-full text-xs font-mono border border-zinc-800 text-zinc-400">OFFLINE</button>
        </div>
        <form id="login-form" class="space-y-4">
          <input id="email" required type="email" placeholder="Email" class="w-full bg-zinc-950 border border-zinc-800 rounded-md px-4 py-2.5 text-zinc-50 placeholder-zinc-600 font-mono text-sm focus:outline-none focus:border-cyan-500 focus:ring-2 focus:ring-cyan-500/20">
          <input id="password" required type="password" placeholder="Password" class="w-full bg-zinc-950 border border-zinc-800 rounded-md px-4 py-2.5 text-zinc-50 placeholder-zinc-600 font-mono text-sm focus:outline-none focus:border-cyan-500 focus:ring-2 focus:ring-cyan-500/20">
          <div id="offline-only" class="hidden space-y-4">
            <input id="recovery-password" type="password" placeholder="Recovery password" class="w-full bg-zinc-950 border border-zinc-800 rounded-md px-4 py-2.5 text-zinc-50 placeholder-zinc-600 font-mono text-sm focus:outline-none focus:border-cyan-500 focus:ring-2 focus:ring-cyan-500/20">
            <div class="grid grid-cols-6 gap-2">
              <input maxlength="1" class="mfa-digit bg-zinc-950 border border-zinc-800 rounded-md h-11 text-center font-mono">
              <input maxlength="1" class="mfa-digit bg-zinc-950 border border-zinc-800 rounded-md h-11 text-center font-mono">
              <input maxlength="1" class="mfa-digit bg-zinc-950 border border-zinc-800 rounded-md h-11 text-center font-mono">
              <input maxlength="1" class="mfa-digit bg-zinc-950 border border-zinc-800 rounded-md h-11 text-center font-mono">
              <input maxlength="1" class="mfa-digit bg-zinc-950 border border-zinc-800 rounded-md h-11 text-center font-mono">
              <input maxlength="1" class="mfa-digit bg-zinc-950 border border-zinc-800 rounded-md h-11 text-center font-mono">
            </div>
          </div>
          <div class="border border-zinc-800 bg-zinc-950 rounded-md p-3 min-h-[78px] flex items-center justify-center">
            <div class="h-captcha" data-theme="dark"></div>
            <span class="text-xs font-mono text-zinc-500">hCaptcha placeholder</span>
          </div>
          <button id="submit-btn" type="submit" class="w-full bg-cyan-500 hover:bg-cyan-400 text-zinc-950 font-mono font-semibold px-5 py-2.5 rounded-md shadow-lg shadow-cyan-500/20 text-sm transition-all focus:outline-none focus:ring-2 focus:ring-cyan-500/20 disabled:opacity-50 disabled:cursor-not-allowed">AUTHENTICATE →</button>
        </form>
        <p class="text-sm text-zinc-500">Don't have an account? <a class="hover:text-cyan-500" href="/register.html">Request access</a></p>
      </section>
      <p class="text-center text-xs text-zinc-600 font-mono">v1.0.0 • Edge-Deployed • Offline-Capable</p>
    </div>
  </main>
  <script type="module">
    import { loginWithEmail, OFFLINE_MODE } from "/js/auth.js";
    import { showToast } from "/js/components.js";
    document.addEventListener("DOMContentLoaded", () => {
      document.querySelector("main").classList.remove("opacity-0", "translate-y-1");
      if (OFFLINE_MODE) {
        const tabs = document.getElementById("mode-tabs");
        tabs.classList.remove("hidden");
        tabs.classList.add("flex");
        document.getElementById("offline-tab").className = "px-4 py-2 rounded-full text-xs font-mono border border-cyan-500 text-cyan-400";
        document.getElementById("offline-only").classList.remove("hidden");
      }
      if (window.lucide?.createIcons) window.lucide.createIcons();
      const digits = [...document.querySelectorAll(".mfa-digit")];
      digits.forEach((input, idx) => input.addEventListener("input", () => {
        if (input.value && idx < digits.length - 1) digits[idx + 1].focus();
      }));
    });
    document.getElementById("login-form").addEventListener("submit", async (event) => {
      event.preventDefault();
      const button = document.getElementById("submit-btn");
      button.disabled = true;
      button.textContent = "AUTHENTICATING...";
      try {
        await loginWithEmail(
          document.getElementById("email").value,
          OFFLINE_MODE ? document.getElementById("recovery-password").value || document.getElementById("password").value : document.getElementById("password").value
        );
        showToast("Authenticated.", "success");
        setTimeout(() => (window.location.href = "/dashboard.html"), 300);
      } catch (error) {
        showToast(error.message, "error");
      } finally {
        button.disabled = false;
        button.textContent = "AUTHENTICATE →";
      }
    });
  </script>
</body>
</html>
